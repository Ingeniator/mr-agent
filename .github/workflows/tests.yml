name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -b -s tests -t .
      - run: python3 -m pip install --quiet basedpyright==1.40.2
      # Scripts without warnings; tests may have warnings (unused mock results and the like), not errors.
      - run: basedpyright --pythonversion 3.11 --warnings *.py
      # basedpyright fails on warnings by default, hence --level error; with GITHUB_ACTIONS set
      # it ignores --level (verified with 1.40.2), so the variable is cleared for this step.
      - run: GITHUB_ACTIONS= basedpyright --pythonversion 3.11 --level error tests/*.py
